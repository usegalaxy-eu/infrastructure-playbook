---
- name: Ticket System with Traefik and Zammad
  become: true
  hosts: ticketsystem
  vars_files:
    - secret_group_vars/all.yml

  pre_tasks:
    - name: Install Ansible dependencies
      ansible.builtin.package:
        name:
          - python3-policycoreutils
          - python3-libselinux
          - policycoreutils-python-utils
          - python3-pip
        state: present

    - name: Install Python dependencies for Ansible modules
      become: true
      ansible.builtin.pip:
        name: "{{ item }}"
      loop:
        - docker
        - selinux

  roles:
    - geerlingguy.repo-epel
    - role: usegalaxy_eu.handy.os_setup
      vars:
        enable_hostname: true
        enable_exclude_packages: true
        enable_install_software: true
    - geerlingguy.docker
    - artis3n.tailscale.machine
    - usegalaxy_eu.firewall

  tasks:
    - name: Ensure Zammad compose directory exists
      ansible.builtin.file:
        path: "{{ zammad_compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: ticketsystem/docker_compose.yml
        dest: "{{ zammad_compose_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0640'
      notify: Restart Zammad

    - name: Deploy environment file
      ansible.builtin.template:
        src: ticketsystem/env.j2
        dest: "{{ zammad_compose_dir }}/.env"
        owner: root
        group: root
        mode: '0640'
      notify: Restart Zammad

    - name: Deploy nginx configuration
      ansible.builtin.template:
        src: ticketsystem/nginx.conf.j2
        dest: "{{ zammad_compose_dir }}/zammad.conf"
        owner: root
        group: root
        mode: '0640'
      notify: Restart Zammad

    - name: Get current Tailscale serve configuration
      ansible.builtin.command:
        cmd: tailscale serve status
      register: tailscale_serve_status
      changed_when: false
      failed_when: false

    - name: Serve Zammad over Tailscale
      ansible.builtin.command:
        cmd: tailscale serve --bg --https=443 http://127.0.0.1:80
      when: "'http://127.0.0.1:80' not in tailscale_serve_status.stdout"

  handlers:
    - name: Restart Zammad
      community.docker.docker_compose_v2:
        project_src: "{{ zammad_compose_dir }}"
        state: present
