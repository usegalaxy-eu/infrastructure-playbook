http:
  routers:
    tpv-broker-rtr:
      rule: "Host(`tpv-broker.galaxyproject.eu`)"
      service: tpv-broker
      entryPoints:
        - websecure
        - web
      tls:
        certResolver: "route53"
        domains:
          - main: "tpv-broker.galaxyproject.eu"
      middlewares:
        - https-redirect
