http:
  routers:
    stats-rtr:
      rule: "Host(`stats.galaxyproject.eu`)"
      service: stats
      entryPoints:
        - websecure
        - web
      middlewares:
        - https-redirect
        - stats-compress
      tls:
        certResolver: "route53"
        domains:
          - main: "stats.galaxyproject.eu"
