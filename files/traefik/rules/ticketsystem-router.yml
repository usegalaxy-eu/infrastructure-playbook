http:
  routers:
    ticketsystem-rtr:
      rule: "Host(`ticketsystem.galaxyproject.eu`)"
      service: ticketsystem
      entryPoints:
        - websecure
        - web
      tls:
        certResolver: "route53"
        domains:
          - main: "ticketsystem.galaxyproject.eu"
      middlewares:
        - https-redirect
