http:
  routers:
    galaxyproject-eu-rtr:
      rule: "Host(`galaxyproject.eu`)"
      service: galaxyproject-eu
      entryPoints:
        - websecure
        - web
      tls:
        certResolver: "route53"
        domains:
          - main: "galaxyproject.eu"
      middlewares:
        - https-redirect
