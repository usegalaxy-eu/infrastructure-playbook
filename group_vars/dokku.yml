hostname: apps.galaxyproject.eu

docker_daemon_options:
  data-root: "/data/docker"
  log-driver: "json-file"
  log-opts: 
    max-size: "10m"
    max-file: "3"
    
apps:
  - ptdk
  # - pwdk
  - oembed
  # - certificates
  # - gtn-slack-bot
  - dnanalyzer
  # - cors
dokku_plugins:
  - name: postgres
    url: https://github.com/dokku/dokku-postgres.git
  - name: redis
    url: https://github.com/dokku/dokku-redis.git
dokku_users:
  - name: github
    username: github
    ssh_key: "ssh-rsa  dokku@github"
dokku_daemon_install: false
dokku_docker_install: true
