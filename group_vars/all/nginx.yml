---
# Preserve the TLS defaults of galaxyproject.nginx 0.6.4 and the former
# usegalaxy-eu.nginx fork when using galaxyproject.nginx 1.0.2.
nginx_ssl_config_profile: default
nginx_conf_ssl_ciphers:
  - ECDHE-ECDSA-AES128-GCM-SHA256
  - ECDHE-ECDSA-AES256-GCM-SHA384
  - ECDHE-ECDSA-AES128-SHA
  - ECDHE-ECDSA-AES256-SHA
  - ECDHE-ECDSA-AES128-SHA256
  - ECDHE-ECDSA-AES256-SHA384
  - ECDHE-RSA-AES128-GCM-SHA256
  - ECDHE-RSA-AES256-GCM-SHA384
  - ECDHE-RSA-AES128-SHA
  - ECDHE-RSA-AES256-SHA
  - ECDHE-RSA-AES128-SHA256
  - ECDHE-RSA-AES256-SHA384
  - DHE-RSA-AES128-GCM-SHA256
  - DHE-RSA-AES256-GCM-SHA384
  - DHE-RSA-AES128-SHA
  - DHE-RSA-AES256-SHA
  - DHE-RSA-AES128-SHA256
  - DHE-RSA-AES256-SHA256
nginx_conf_ssl_prefer_server_ciphers: 'on'
nginx_conf_ssl_session_cache: shared:SSL:8m
nginx_conf_ssl_session_timeout: 5m
nginx_conf_ssl_dhparam: /etc/nginx/ssl/dhparams.pem
# 1.0.2 otherwise renders empty stapling directives with its default profile.
# An empty string omits them, as the previous roles did without a trusted CA.
nginx_conf_ssl_stapling: ''
