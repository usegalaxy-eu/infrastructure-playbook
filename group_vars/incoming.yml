---
# Autofs
autofs_mount_points:
 - data
 - jwd
 - misc

# autofs_conf_files:
#   data:
#     - jwd     -rw,hard,nosuid      denbi.svm.bwsfs.uni-freiburg.de:/ws01/&
#     - jwd01   -rw,hard,nosuid       noads1.svm.bwsfs.uni-freiburg.de:/galaxy-mwd01/

autofs_service.install: true
autofs_service.enable: true

nfs_kernel_tuning: true

# usegalaxy_eu.handy.os_setup
# Rocky 10 provides `ansible-core` but no `ansible` meta-package. This host
# does not require Ansible locally, so omit the collection's configuration group.
software_groups_to_install:
  - admin
  - editors
  - utils

# GALAXY
galaxy_group:
  name: galaxy
  gid: 999
galaxy_system_group: galaxy
galaxy_user:
  name: galaxy
  create_home: true
  home: /opt/galaxy
  uid: 999
  shell: /bin/bash

# Certbot
server_names:
  - 'ftp.usegalaxy.eu'
certbot_auto_renew_hour: "{{ 23 |random(seed=inventory_hostname)  }}"
certbot_auto_renew_minute: "{{ 59 |random(seed=inventory_hostname)  }}"
certbot_dns_provider: route53
certbot_install_method: virtualenv
certbot_auto_renew: true
certbot_auto_renew_user: root
certbot_share_key_users:
  - proftpd
certbot_post_renewal: |
    systemctl restart proftpd || true
certbot_domains: "{{ server_names }}"
certbot_agree_tos: --agree-tos
certbot_virtualenv_package_name: python3-virtualenv
aws_cli_credentials:
  - access_key: "{{ aws_credentials.certbot.AWS_ACCESS_KEY }}"
    secret_key: "{{ aws_credentials.certbot.AWS_SECRET_KEY }}"
    homedir: /root
    owner: root
    group: root

# Proftpd:
proftpd_modules_config_file: /etc/proftpd/modules.conf
proftpd_galaxy_auth: true
galaxy_ftp_upload_dir: "{{ galaxy_config.galaxy.ftp_upload_dir }}"
proftpd_display_connect: |
  {{ inventory_hostname }} FTP server

  Unauthorized access is prohibited
proftpd_options:
  - User: galaxy
  - Group: galaxy
  - Port: 21
proftpd_sql_db: "{{ proftpd__galaxy_db_connection }}"
proftpd_sql_user: ''
proftpd_conf_ssl_certificate: /etc/letsencrypt/live/ftp.usegalaxy.eu/cert.pem
proftpd_conf_ssl_certificate_key: /etc/letsencrypt/live/ftp.usegalaxy.eu/privkey.pem
proftpd_conf_ssl_ca_certificate: /etc/letsencrypt/live/ftp.usegalaxy.eu/chain.pem
proftpd_global_options:
  - MasqueradeAddress: ftp.usegalaxy.eu
  - PassivePorts: 49152 65534
  - TransferLog: /var/log/proftpd/xfer.log
proftpd_use_mod_tls_shmcache: false
proftpd_tls_options: NoSessionReuseRequired

# ssh_hardening EL10
ssh_host_keys_group: root
