---
# Autofs
autofs_mount_points:
  - data
  - jwd
  - misc

nfs_kernel_tuning: true

# usegalaxy_eu.handy.os_setup
# Rocky 10 provides `ansible-core` but no `ansible` meta-package. This host
# does not require Ansible locally, so omit the collection's configuration group.
software_groups_to_install:
  - admin
  - editors
  - utils

# GALAXY
galaxy_group:
  name: galaxy
  gid: 999
galaxy_system_group: galaxy
galaxy_user:
  name: galaxy
  create_home: true
  home: /opt/galaxy
  uid: 999
  shell: /bin/bash

# Proftpd:
proftpd_modules_config_file: /etc/proftpd/modules.conf
proftpd_galaxy_auth: true
galaxy_ftp_upload_dir: "{{ galaxy_config.galaxy.ftp_upload_dir }}"
proftpd_display_connect: |
  {{ inventory_hostname }} FTP server

  Unauthorized access is prohibited
proftpd_options:
  - User: galaxy
  - Group: galaxy
  - Port: 21
proftpd_sql_db: "{{ proftpd__galaxy_db_connection }}"
proftpd_sql_user: ''
proftpd_global_options:
  - PassivePorts: 49152 65534
  - TransferLog: /var/log/proftpd/xfer.log
proftpd_use_mod_tls_shmcache: false
proftpd_tls_options: NoSessionReuseRequired
