---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

defaults:
  run:
    working-directory: 'infrastructure-playbook'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v2
        with:
          path: 'infrastructure-playbook'

      - name: Set up Python.
        uses: actions/setup-python@v6
        with:
          python-version-file: 'infrastructure-playbook/.python-version'
          cache: 'pip'
          cache-dependency-path: |
            infrastructure-playbook/requirements.txt
            infrastructure-playbook/.github/requirements-python-lint.txt

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v4
        with:
          path: |
            infrastructure-playbook/roles
            infrastructure-playbook/collections
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('infrastructure-playbook/requirements.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ansible-galaxy-

      - name: Install test dependencies.
        run: |
          pip3 install -r requirements.txt -r .github/requirements-python-lint.txt

      - name: Prepare vault placeholders.
        run: |
          printf '%s\n' 'fake_password' > .vault_password
          make clear_vault

      - name: Install Ansible Galaxy dependencies.
        run: |
          for attempt in 1 2 3; do
            echo "Installing dependencies (attempt $attempt of 3)"
            if make deps; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1

      - name: Validate repository.
        run: make lint syntax
