---
- name: UseGalaxy EU Postfix relay
  hosts: postfix
  become: true
  become_user: root
  vars_files:
    - secret_group_vars/all.yml
  pre_tasks:
    - name: Install EPEL-release
      ansible.builtin.package:
        name: epel-release
        state: present
    - name: Ensure firewalld is running
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
    - name: Configure firewalld to open ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        immediate: true
        permanent: true
        state: enabled
      with_items:
        - 587/tcp  # postfix submission (galaxy -> relay -> upstream smtp)
  roles:
    - usegalaxy_eu.postfix-relay
