- name: "Ensure permissions for OSIRIS PHP files"
  ansible.builtin.file:
    path: "{{ osiris_www_dir }}"
    owner: "apache"
    group: "apache"
    mode: "u=rwX,g=rwX,o="
    recurse: true
    state: directory

- name: "Ensure OSIRIS DB_NAME is defined"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("DB_NAME",'
    line: 'define("DB_NAME", "{{ mongo_dbname }}");'
    state: present

- name: "Ensure OSIRIS connection string is correct"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("DB_STRING",'
    line: 'define("DB_STRING", "{{ mongo_connection }}");'
    state: present

- name: "Ensure OSIRIS username+pass auth is possible"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("USER_MANAGEMENT",'
    line: 'define("USER_MANAGEMENT", "{{ osiris_user_management }}");'
    state: present

- name: "Ensure OSIRIS OpenID Connect label"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("OAUTH",'
    line: 'define("OAUTH", "{{ osiris_oauth_label }}");'
    state: present

- name: "Ensure OSIRIS OpenID Connect client id is set"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("CLIENT_ID",'
    line: 'define("CLIENT_ID", "{{ osiris_oauth_client_id }}");'
    state: present

- name: "Ensure OSIRIS OpenID Connect client secret is set"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("CLIENT_SECRET",'
    line: 'define("CLIENT_SECRET", "{{ osiris_oauth_client_secret }}");'
    state: present

- name: "Ensure OSIRIS OpenID Connect redirect url is set"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("REDIRECT_URI",'
    line: 'define("REDIRECT_URI", "{{ osiris_oauth_callback }}");'
    state: present

- name: "Ensure OSIRIS OpenID Connect authority url is set"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("AUTHORITY",'
    line: 'define("AUTHORITY", "{{ osiris_oauth_authority }}");'
    state: present

- name: "Ensure OSIRIS OpenID Connect scopes are set"
  ansible.builtin.lineinfile:
    path: "{{ osiris_config_file }}"
    regexp: '^define\("SCOPES",'
    line: 'define("SCOPES", "{{ osiris_oauth_scopes }}");'
    state: present

- name: "Adjust php.ini settings (larger uploads and security)"
  community.general.ini_file:
    path: "{{ php_conf }}"
    section: PHP
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    create: false
  loop:
    - { key: "memory_limit, value": "256M" }
    - { key: "upload_max_filesize", value: "12M" }
    - { key: "post_max_size", value: "12M" }
    - { key: "max_execution_time", value: "60" }
    # This setting was introduced due to CVE-2026-115560
    - { key: "session.upload_progress.enabled", value: "0" }
  notify: Restart php-fpm

- name: Remove default ssl vhost configurations
  ansible.builtin.replace:
    path: "{{ apache_conf_path }}/ssl.conf"
    regexp: '##\n## SSL Virtual Host Context(.*\n)*</VirtualHost>'
    backup: true
  notify: restart apache

- name: Ensure firewall allows connections via http (port 80)
  ansible.posix.firewalld:
    service: http
    state: enabled
    permanent: true
    immediate: true
    offline: true

- name: Ensure firewall allows connections via https (port 443)
  ansible.posix.firewalld:
    service: https
    state: enabled
    permanent: true
    immediate: true
    offline: true
