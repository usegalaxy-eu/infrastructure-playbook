---
- name: "Checkout matching OSIRIS version"
  ansible.builtin.git:
    repo: "{{ osiris_repo }}"
    dest: "{{ osiris_www_dir }}"
    version: "{{ osiris_version }}"
    update: true
  become: yes
  become_user: "apache"
  environment:
    ANSIBLE_SYSTEM_WARNINGS: "False"
  vars:
    # Prevent ansible from using $HOME/.ansible/tmp
    # which for 'apache' is /usr/share/httpd/.ansible/tmp
    ansible_remote_tmp: /tmp/ansible_osiris_checkout

- name: "Disallow all web crawlers via robots.txt"
  ansible.builtin.copy:
    dest: "{{ osiris_www_dir }}/robots.txt"
    content: |
      User-agent: *
      Disallow: /
    owner: "apache"
    group: "apache"
    mode: "0640"

- name: "Download composer installer"
  ansible.builtin.get_url:
    url: "https://getcomposer.org/installer"
    dest: "/tmp/composer-setup.php"
    mode: "0644"

- name: "Install php composer"
  ansible.builtin.command: "{{ php_bin }} --install-dir=/usr/local/bin --filename=composer"

- name: "Delete composer installer"
  ansible.builtin.file:
    path: "/tmp/composer-setup.php"
    state: absent

- name: "Update OSIRIS dependencies with composer"
  become: true
  become_user: apache
  ansible.builtin.shell:
    chdir: "{{ osiris_www_dir }}"
    cmd: 'PATH="{{ php_bin_dir }}:$PATH" /usr/local/bin/composer update --ignore-platform-reqs'

- name: "Ensure permissions for OSIRIS PHP files"
  ansible.builtin.file:
    path: "{{ osiris_www_dir }}"
    owner: "apache"
    group: "apache"
    mode: "u=rwX,g=rwX,o="
    recurse: true
    state: directory
