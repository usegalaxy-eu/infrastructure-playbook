---
- name: Reload systemd for Galaxy cleanup
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Galaxy cleanup timer
  ansible.builtin.systemd:
    name: "{{ galaxy_cleanup_systemd_timer }}"
    state: restarted

- name: Restart Galaxy cleanup force-retry timer
  ansible.builtin.systemd:
    name: "{{ galaxy_cleanup_force_retry_timer }}"
    state: restarted
