---
- name: Check that all objectstore_id include 'scratch'
  assert:
    that:
      - galaxy_cleanup_scratchstorage | length > 0
      - galaxy_cleanup_scratchstorage | list
        | reject('search', 'scratch')
        | list
        | length == 0
    fail_msg: "Found objectstore_id entries that do NOT contain 'scratch'"
    success_msg: "All objectstore_id values contain 'scratch'"

- name: Install cleanup script
  template:
    src: "cleanup_storage.sh.j2"
    dest: "/usr/local/bin/cleanup_storage.sh"
    mode: "0555"

- name: Schedule Galaxy cleanup objectstore script
  ansible.builtin.cron:
    name: "Galaxy cleanup scratch"
    job: "/usr/local/bin/cleanup_storage.sh"
    minute: "{{ galaxy_cleanup_minute }}"
    hour: "{{ galaxy_cleanup_hour }}"
    user: "{{ galaxy_user.name }}"

- name: Install annual Galaxy cleanup force-retry script
  ansible.builtin.template:
    src: cleanup_force_retry.sh.j2
    dest: /usr/local/bin/cleanup_force_retry.sh
    owner: root
    group: root
    mode: "0555"

- name: Install annual Galaxy cleanup force-retry service
  ansible.builtin.template:
    src: galaxy-cleanup-force-retry.service.j2
    dest: "/etc/systemd/system/{{ galaxy_cleanup_force_retry_service }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for annual Galaxy cleanup

- name: Install annual Galaxy cleanup force-retry timer
  ansible.builtin.template:
    src: galaxy-cleanup-force-retry.timer.j2
    dest: "/etc/systemd/system/{{ galaxy_cleanup_force_retry_timer }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for annual Galaxy cleanup
    - Restart annual Galaxy cleanup timer

- name: Enable annual Galaxy cleanup force-retry timer
  ansible.builtin.systemd:
    name: "{{ galaxy_cleanup_force_retry_timer }}"
    enabled: true
    state: started
