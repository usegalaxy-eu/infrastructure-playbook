---
- name: Install systemd service D-state collector
  ansible.builtin.template:
    src: systemd-dstate-collector.py.j2
    dest: /usr/bin/systemd-dstate-collector
    owner: root
    group: root
    mode: "0755"

- name: Ensure Telegraf configuration directory exists
  ansible.builtin.file:
    path: /etc/telegraf/telegraf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Telegraf systemd D-state collector
  ansible.builtin.template:
    src: systemd-dstate-telegraf.conf.j2
    dest: /etc/telegraf/telegraf.d/systemd-dstate.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart Telegraf after configuring systemd D-state collector
