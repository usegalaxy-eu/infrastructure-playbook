---
# Fast path to deploy only the nginx configuration on sn09, without running
# the full (slow) sn09.yml. Run with:
#
#   ansible-playbook one-off/sn09-nginx.yml
#
# This play is a stripped copy of sn09.yml:
#
#   * `vars`, `vars_files`, `handlers` and the pre_tasks are verbatim copies.
#     The vars_files paths are prefixed with `{{ playbook_dir }}/../` because
#     Ansible resolves relative vars_files paths against the playbook's
#     directory: without the prefix, running from one-off/ silently skips
#     every file (a missing vars_file does not fail the play) and the vhost
#     templates then fail on undefined variables. If sn09.yml changes, adjust
#     both together.
#
#   * Every role that is not needed for the nginx deployment stays in the
#     list but is skipped with `when: false`. Role defaults are loaded for
#     the whole play whether or not the role's tasks run, and
#     templates/nginx/galaxy-main.j2 depends on defaults from
#     usegalaxy_eu.galaxy_systemd, usegalaxy-eu.gapars-galaxy and
#     galaxyproject.tiaas2. Keeping the roles (skipped) instead of removing
#     them keeps the variable environment identical to a full sn09.yml run.
#
#   * Only the roles the nginx deployment needs actually run: hxr.aws-cli
#     (route53 credentials for certbot, must come before the nginx role),
#     the upload module, the nginx role itself and the error pages.
#
# The templates for the vhosts are resolved relative to the playbook
# directory, hence the one-off/templates symlink to ../templates.
- name: sn09 nginx configuration
  hosts: sn09
  become: true
  become_user: root
  vars:
    # The full internal name.
    hostname: sn09.galaxyproject.eu
    # The nginx user needed into the galaxyproject.nginx role
    nginx_conf_user: galaxy
    # This server has multiple CNAMEs that are important. Additionally it
    # provides proxying for many of the other services run by Galaxy Europe.
    # These server_names are passed to certbot. They generally should not need
    # to be updated unless you add a new domain. They *only* work with the
    # route53 provider, so if we want to do usegalaxy.xy, it may require
    # refactoring / multiple certbot runs.
    #
    #
    # The best way to expand them is to run the playbook, it will leave a message with the command it would have run (look for `skipped, since /etc/letsencrypt/renewal/usegalaxy.eu.conf exists`)
    #
    # Then take this command to the command line (root@sn04) and run it with `--expand`. E.g. (DO NOT COPY PASTE (in case the config changes))
    #
    # $ /opt/certbot/bin/certbot certonly --non-interactive --dns-route53 \
    #     -m security@usegalaxy.eu --agree-tos -d 'usegalaxy.eu,*.usegalaxy.eu,galaxyproject.eu,*.galaxyproject.eu,*.interactivetoolentrypoint.interactivetool.usegalaxy.eu,*.interactivetoolentrypoint.interactivetool.live.usegalaxy.eu,*.interactivetoolentrypoint.interactivetool.test.usegalaxy.eu' --expand
    # Saving debug log to /var/log/letsencrypt/letsencrypt.log
    # Credentials found in config file: ~/.aws/config
    # ....
    # IMPORTANT NOTES:
    #  - Congratulations! Your certificate and chain have been saved at:
    #
    # And you're done expanding the certs.
    #
    # The nginx user needed into the galaxyproject.nginx role
    server_names:
      - 'usegalaxy.eu'
      - '*.usegalaxy.eu'
      - 'galaxyproject.eu'
      - '*.galaxyproject.eu'
      - '*.ep.interactivetool.usegalaxy.eu'
      - '*.ep.interactivetool.live.usegalaxy.eu'
      - '*.ep.interactivetool.test.usegalaxy.eu'
      - '*.aqua.usegalaxy.eu'
      - '*.ep.interactivetool.aqua.usegalaxy.eu'
      - '*.ecology.usegalaxy.eu'
      - '*.ep.interactivetool.ecology.usegalaxy.eu'
      - '*.earth-system.usegalaxy.eu'
      - '*.ep.interactivetool.earth-system.usegalaxy.eu'
      - '*.eirene.usegalaxy.eu'
      - '*.ep.interactivetool.eirene.usegalaxy.eu'
  vars_files:
    - '{{ playbook_dir }}/../group_vars/sn09/sn09.yml'
    - '{{ playbook_dir }}/../group_vars/sn09/themes_conf.yml'
    - '{{ playbook_dir }}/../group_vars/sn09/subdomains.yml'
    - '{{ playbook_dir }}/../group_vars/sn09/toolmsg.yml'
    - '{{ playbook_dir }}/../group_vars/tiaas.yml' # All of the training infrastructure
    - '{{ playbook_dir }}/../group_vars/gxconfig.yml' # The base galaxy configuration
    - '{{ playbook_dir }}/../group_vars/toolbox.yml' # User controlled toolbox
    - '{{ playbook_dir }}/../secret_group_vars/sentry.yml' # Sentry SDK init url
    - '{{ playbook_dir }}/../secret_group_vars/aws.yml' # AWS creds
    - '{{ playbook_dir }}/../secret_group_vars/pulsar.yml' # Pulsar + MQ Connections
    - '{{ playbook_dir }}/../group_vars/pulsar_relay/vault.yml' # NEMO relay credentials
    - '{{ playbook_dir }}/../secret_group_vars/oidc.yml' # OIDC credentials (ELIXIR, keycloak)
    - '{{ playbook_dir }}/../secret_group_vars/object_store.yml' # Object Store credentils (S3 etc ...)
    - '{{ playbook_dir }}/../secret_group_vars/db-main.yml' # DB URL + some postgres stuff
    - '{{ playbook_dir }}/../secret_group_vars/file_sources.yml' # file_sources_conf.yml creds
    - '{{ playbook_dir }}/../secret_group_vars/all.yml' # All of the other assorted secrets...
    - '{{ playbook_dir }}/../secret_group_vars/keys.yml' # SSH keys
    - '{{ playbook_dir }}/../templates/galaxy/config/job_conf.yml'
    - '{{ playbook_dir }}/../mounts/dest/all.yml'
    - '{{ playbook_dir }}/../mounts/mountpoints.yml'
  handlers:
    - name: Restart telegraf to pick up the nginx log access
      ansible.builtin.systemd:
        name: telegraf
        state: restarted
    - name: Restart Galaxy
      ansible.builtin.shell: |
        cd /opt/galaxy/ && source /opt/galaxy/.bashrc && /usr/bin/gxadmin gunicorn handler-restart && sudo -u galaxy /usr/bin/galaxy-sync-to-nfs && systemctl restart galaxy-handler@* && systemctl restart galaxy-workflow-scheduler@*
      listen: 'restart galaxy'
  pre_tasks:
    # This should be the 1st pretask as the rest of the tasks are dependent on it.
    - name: Install EPEL-release
      ansible.builtin.package:
        name: epel-release
        state: present

    - name: Disable SELinux
      ansible.posix.selinux:
        state: disabled

    - name: Deploy security.txt
      ansible.builtin.copy:
        src: files/galaxy/config/security.txt
        dest: /etc/nginx/security.txt
        owner: root
        group: root
        mode: "0644"

    - name: Deploy robots.txt (block LLM crawlers)
      ansible.builtin.copy:
        src: files/galaxy/config/robots.txt
        dest: /etc/nginx/robots.txt
        owner: root
        group: root
        mode: "0644"
  roles:
    ## Starting configuration of the operating system
    - role: usegalaxy_eu.handy.os_setup
      when: false # not needed for the nginx deployment
      vars:
        enable_hostname: true
        enable_powertools: true # geerlingguy.repo-epel role doesn't enable PowerTools repository
        enable_remap_user: true
        enable_exclude_packages: true
        enable_pam_limits: true # Prevent out of control processes
        enable_install_software: true # Some extra admin tools (*top, vim, etc)
    - role: geerlingguy.repo-epel # Install EPEL repository
      when: false # not needed for the nginx deployment
    - role: usegalaxy_eu.uv
      when: false # not needed for the nginx deployment
    - role: influxdata.chrony # Keep our time in sync.
      when: false # not needed for the nginx deployment

    ## Filesystems
    - role: usegalaxy-eu.autofs # Setup the mount points which will be needed later
      when: false # not needed for the nginx deployment
    - role: galaxyproject.cvmfs # Galaxy datasets
      when: false # not needed for the nginx deployment

    ## Monitoring
    - role: hxr.monitor-email
      when: false # not needed for the nginx deployment
    - role: hxr.monitor-galaxy-journalctl
      when: false # not needed for the nginx deployment

    # Setup Galaxy user
    - role: galaxyproject.galaxy
      when: false # not needed for the nginx deployment
      vars:
        galaxy_create_user: true
        galaxy_manage_clone: false
        galaxy_manage_cleanup: false # we should use this
        galaxy_manage_download: false
        galaxy_manage_existing: true
        galaxy_manage_paths: true
        galaxy_manage_static_setup: false
        galaxy_manage_mutable_setup: false
        galaxy_manage_database: false
        galaxy_manage_subdomain_static: false
        galaxy_fetch_dependencies: false
        galaxy_build_client: false
        galaxy_manage_systemd: false # switch to gravity(?)
        galaxy_manage_gravity: false
    # The bashrc needs to be created for several later features.
    - role: usegalaxy-eu.bashrc
      when: false # not needed for the nginx deployment

    ## Setup docker
    - role: geerlingguy.docker
      when: false # not needed for the nginx deployment

    # Misc.
    - role: hxr.galaxy-nonreproducible-tools
      when: false # not needed for the nginx deployment
      become: true
      become_user: galaxy
    - role: usegalaxy-eu.dynmotd # nicer MOTD/welcome message
      when: false # not needed for the nginx deployment

    - role: usegalaxy-eu.rsync-to-nfs # sync codebase to NFS
      when: false # not needed for the nginx deployment

    - role: usegalaxy-eu.webhooks # Clone webhook repository
      when: false # not needed for the nginx deployment
      become: true
      become_user: galaxy
    - role: usegalaxy-eu.tours # Clone tour repository
      when: false # not needed for the nginx deployment
      become: true
      become_user: galaxy

    ## SSL / Security
    # https://en.wikipedia.org/wiki/Trust_on_first_use
    - role: ssh-host-sign # Sign the server host key to prevent TOFU for SSH
      when: false # not needed for the nginx deployment
    # Setup the AWS client that will be needed for route53 authentication of
    # certbot. MUST come before nginx role
    - hxr.aws-cli

    ## GALAXY
    - role: hxr.postgres-connection
      when: false # not needed for the nginx deployment
    - role: galaxyproject.gxadmin
      when: false # not needed for the nginx deployment

    - usegalaxy_eu.ansible_nginx_upload_module
    - usegalaxy-eu.nginx

    - role: usegalaxy-eu.gapars-galaxy
      when: false # only kept for its role defaults (galaxy-main.j2)

    # The REAL galaxy role call that will install Galaxy and all of its dependencies.
    - role: galaxyproject.galaxy
      when: false # not needed for the nginx deployment
      vars:
        galaxy_create_user: true
        galaxy_manage_clone: true
        galaxy_manage_cleanup: false # we should use this
        galaxy_manage_download: false
        galaxy_manage_existing: false
        galaxy_manage_static_setup: true
        galaxy_manage_mutable_setup: true
        galaxy_manage_database: true
        galaxy_manage_subdomain_static: true
        galaxy_manage_host_filters: false # test when themes work
        galaxy_manage_systemd: false # switch to gravity(?)
        galaxy_manage_gravity: false
        galaxy_fetch_dependencies: true
        galaxy_build_client: true
        galaxy_client_make_target: client-production

    - role: usegalaxy_eu.tpv_auto_lint
      when: false # not needed for the nginx deployment
    - role: galaxyproject.tiaas2
      when: false # only kept for its role defaults (galaxy-main.j2)
    ## Extras!
    - role: usegalaxy-eu.fix-galaxy-server-dir # Fix details into the galaxy server dirs
      when: false # not needed for the nginx deployment
    - role: hxr.install-to-venv # Some extra packages our site needs.
      when: false # not needed for the nginx deployment
    - role: usegalaxy_eu.galaxy_systemd # Manage the Galaxy processes with SystemD
      when: false # only kept for its role defaults (galaxy-main.j2)
    - role: usegalaxy-eu.update-hosts # Update hosts list
      when: false # not needed for the nginx deployment
    - role: usegalaxy_eu.gie_proxy # Setup the NodeJS proxy for GxIT
      when: false # not needed for the nginx deployment
    - role: usegalaxy_eu.fs_maintenance # Filesystems maintenance
      when: false # not needed for the nginx deployment
    - role: usegalaxy-eu.logrotate # Rotate logs
      when: false # not needed for the nginx deployment
    - usegalaxy-eu.error-pages # Copy the NGINX error pages
    - role: usegalaxy-eu.fix-stuck-handlers # Restart handlers to prevent several classes of issues
      when: false # not needed for the nginx deployment
    - role: usegalaxy-eu.log-cleaner # do not retain journalctl logs, they are unnecessary/risky under GDPR
      when: false # not needed for the nginx deployment
    - role: dj-wasabi.telegraf
      when: false # not needed for the nginx deployment
    - role: usegalaxy-eu.galaxy-procstat # Some custom telegraf monitoring that's templated
      when: false # not needed for the nginx deployment
    - role: devsec.hardening.ssh_hardening
      when: false # not needed for the nginx deployment
    - role: usegalaxy-eu.fix-stop-ITs
      when: false # not needed for the nginx deployment
    - role: usegalaxy_eu.firewall
      when: false # not needed for the nginx deployment
  post_tasks:
    # Grant read access via a POSIX ACL on the current file, and a default
    # ACL on the directory so the file nginx recreates at logrotate stays readable.
    - name: Allow telegraf to read the nginx rate limit log
      ansible.posix.acl:
        path: "{{ item.path }}"
        entry: "{{ item.entry }}"
        state: present
      loop:
        - path: /var/log/nginx/rate_limit.log
          entry: "u:{{ telegraf_user.name }}:r"
        - path: /var/log/nginx
          entry: "d:u:{{ telegraf_user.name }}:r"
      register: __telegraf_log_access
      notify: Restart telegraf to pick up the nginx log access
