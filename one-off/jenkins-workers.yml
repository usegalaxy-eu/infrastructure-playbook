---
- name: One-off Jenkins worker setup
  hosts: build-workers
  become: true
  vars_files:
    - secret_group_vars/jenkins.yml
  vars:
    miniconda_prefix: /scratch/miniconda
    miniconda_channels:
      - conda-forge
  pre_tasks:
    - name: Install Dependencies
      package:
        name:
          [
            'git',
            'java-21-openjdk',
            'java-21-openjdk-devel',
            'rsync',
            'firewalld',
          ]
      become: true

    - name: Make Scratch directory for miniconda
      file:
        path: {{ miniconda_prefix }}
        state: directory
        owner: centos
        group: centos
        mode: "0755"

    - name: Add Jenkins SSH key to centos authorized_keys
      ansible.posix.authorized_key:
        user: centos
        key: "{{ ssh_manager_authorized_persons.jenkins.key }}"
        state: present
      no_log: true

    - name: Disable host key verification for github.com
      ansible.builtin.copy:
        dest: /home/centos/.ssh/config
        mode: "0600"
        owner: centos
        group: centos
        content: |
          Host github.com
                  CheckHostIP no

    - name: Install qemu-kvm
      ansible.builtin.package:
        name: qemu-kvm
        state: present

  roles:
    - galaxyproject.miniconda
    - geerlingguy.docker
