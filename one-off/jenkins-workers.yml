---
- name: One-off Jenkins worker setup
  hosts: build-workers
  become: true
  vars_files:
    - secret_group_vars/jenkins.yml
  vars:
    miniconda_prefix: /scratch/miniconda
    miniconda_channels:
      - conda-forge
  pre_tasks:
    - name: Install Dependencies
      package:
        name:
          [
            'git',
            'java-21-openjdk',
            'java-21-openjdk-devel',
            'rsync',
            'firewalld',
            'qemu-kvm-core',  # qemu-kvm instead if it does not work to build images
          ]
        state: present
      become: true

    - name: Add Jenkins SSH key to centos authorized_keys
      ansible.posix.authorized_key:
        user: centos
        key: "{{ ssh_manager_authorized_persons.jenkins.key | join('\n') }}"
        state: present

    - name: Disable host key verification for github.com
      ansible.builtin.copy:
        dest: /home/centos/.ssh/config
        mode: "0600"
        owner: centos
        group: centos
        content: |
          Host github.com
                  CheckHostIP no
  roles:
    - galaxyproject.miniconda
    - geerlingguy.docker

  post_tasks:
    - name: Scan host keys for inventory hosts
      ansible.builtin.command: "ssh-keyscan -t ed25519 {{ item }}"
      loop: "{{ groups['all'] }}"
      delegate_to: localhost
      become: false
      register: keyscan_results
      changed_when: false
      failed_when: false

    - name: Add scanned keys to worker known_hosts
      become: true
      ansible.builtin.known_hosts:
        name: "{{ item.item }}"
        key: "{{ item.stdout }}"
        path: /etc/ssh/ssh_known_hosts
      loop: "{{ keyscan_results.results }}"
      when: item.stdout is defined and item.rc == 0
